name: Promptfoo PR security gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: promptfoo-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promptfoo-security-gate:
    name: Promptfoo security gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run Promptfoo regression and generated red-team suites
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: google/gemma-4-26b-a4b-it:free
          PROMPTFOO_DISABLE_TELEMETRY: 'true'
        shell: bash
        run: |
          set +e
          npm run regression
          regression_status=$?
          npm run redteam
          redteam_status=$?
          set -e

          if [ "$regression_status" -ne 0 ] || [ "$redteam_status" -ne 0 ]; then
            echo "One or more Promptfoo suites failed. Download the reports from this run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Both Promptfoo suites passed." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Promptfoo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-security-${{ github.run_id }}
          path: |
            regression-latest.json
            regression-latest.junit.xml
            redteam-latest.json
            evaluations/
          if-no-files-found: ignore
          retention-days: 30
