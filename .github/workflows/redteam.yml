name: Promptfoo PR security gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promptfoo-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promptfoo-security-gate:
    name: Promptfoo security gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run Promptfoo plugin red-team suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: google/gemma-4-26b-a4b-it
          PROMPTFOO_DISABLE_TELEMETRY: 'true'
        run: npm run redteam
      - name: Build detailed Promptfoo PR comment
        if: always()
        env:
          PROMPTFOO_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run report:pr
      - name: Create or update Promptfoo PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- promptfoo-security-findings -->';
            const body = fs.readFileSync('promptfoo-pr-comment.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Upload Promptfoo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-security-${{ github.run_id }}
          path: |
            redteam-latest.json
            promptfoo-pr-comment.md
            evaluations/
          if-no-files-found: ignore
          retention-days: 30
