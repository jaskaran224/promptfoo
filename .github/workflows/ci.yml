name: Chatbot safety evaluation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptfoo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Require evaluation secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "$OPENROUTER_API_KEY" || (echo "OPENROUTER_API_KEY repository secret is required" && exit 1)
      - name: Run Promptfoo CI gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: google/gemma-4-26b-a4b-it:free
          PROMPTFOO_DISABLE_TELEMETRY: 'true'
        run: npm run eval
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-evaluation-${{ github.run_id }}
          path: evaluations/
          if-no-files-found: ignore
          retention-days: 14

